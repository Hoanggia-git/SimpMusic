name: Build SimpMusic iOS (.ipa)

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Dọn dẹp và vá lỗi mã nguồn cho iOS
        run: |
          # 1. Xóa các thư mục trùng lặp cũ
          rm -rf core/service/ktorExt/src/iosArm64Main
          rm -rf core/service/ktorExt/src/iosSimulatorArm64Main
          rm -rf core/service/ktorExt/src/iosX64Main
          rm -rf core/data/src/iosArm64Main
          rm -rf core/data/src/iosSimulatorArm64Main
          rm -rf core/data/src/iosX64Main

          # 2. Vá lỗi Dispatchers.IO -> Dispatchers.Default trong Resource.kt
          sed -i '' 's/Dispatchers\.IO/Dispatchers\.Default/g' core/domain/src/commonMain/kotlin/com/maxrave/domain/utils/Resource.kt

          # 3. Vá lỗi Okio AutoCloseable trong MessageCodec.kt
          python3 -c '
          file = "core/service/listenTogether/src/commonMain/kotlin/org/simpmusic/listentogether/MessageCodec.kt"
          with open(file, "r") as f:
              code = f.read()
          code = code.replace("GzipSink(sink).buffer().use { it.write(data) }", "val g = GzipSink(sink).buffer()\n        g.write(data)\n        g.close()")
          code = code.replace("GzipSource(Buffer().apply { write(data) }).buffer().use { it.readByteArray() }", "val g = GzipSource(Buffer().apply { write(data) }).buffer()\n            val r = g.readByteArray()\n            g.close()\n            r")
          with open(file, "w") as f:
              f.write(code)
          '

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Cấp quyền thực thi cho Gradle
        run: chmod +x ./gradlew

      - name: Biên dịch Kotlin Native Framework độc lập
        run: ./gradlew :composeApp:linkDebugFrameworkIosArm64 --stacktrace

      - name: Đóng gói thành file .ipa
        run: |
          mkdir -p build/Payload/SimpMusic.app
          # Tìm framework vừa build được
          FRAMEWORK_DIR=$(find composeApp/build/bin/iosArm64 -name "ComposeApp.framework" -type d | head -n 1)
          echo "Tìm thấy Framework tại: $FRAMEWORK_DIR"
          
          # Đưa framework và cấu hình vào thư mục ứng dụng
          cp -r "$FRAMEWORK_DIR" build/Payload/SimpMusic.app/
          cp iosApp/Info.plist build/Payload/SimpMusic.app/
          
          # Nén thành file .ipa
          cd build
          zip -r SimpMusic.ipa Payload

      - name: Tải file .ipa lên Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SimpMusic-iOS-IPA
          path: build/SimpMusic.ipa
          retention-days: 7
