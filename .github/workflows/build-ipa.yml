name: Build SimpMusic iOS (.ipa)

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Quét và tự động vá toàn diện mọi lỗi iOS trong toàn bộ dự án
        run: |
          python3 -c '
          import os, re

          print("--- BẮT ĐẦU QUÉT VÀ VÁ TOÀN BỘ CODEBASE ---")

          # 1. Xóa tất cả các thư mục kiến trúc cũ bị xung đột với iosMain
          target_dirs = ["iosArm64Main", "iosSimulatorArm64Main", "iosX64Main"]
          for root, dirs, files in os.walk(".", topdown=False):
              for d in dirs:
                  if d in target_dirs:
                      full_path = os.path.join(root, d)
                      print(f"Xóa thư mục trùng lặp: {full_path}")
                      os.system(f"rm -rf \"{full_path}\"")

          # 2. Quét tất cả file .kt để thay thế Dispatchers.IO thành Dispatchers.Default
          for root, dirs, files in os.walk("."):
              for file in files:
                  if file.endswith(".kt"):
                      filepath = os.path.join(root, file)
                      with open(filepath, "r", encoding="utf-8", errors="ignore") as f:
                          content = f.read()
                      if "Dispatchers.IO" in content:
                          print(f"Vá Dispatchers.IO trong: {filepath}")
                          content = content.replace("Dispatchers.IO", "Dispatchers.Default")
                          with open(filepath, "w", encoding="utf-8") as f:
                              f.write(content)

          # 3. Vá lỗi Okio AutoCloseable trong MessageCodec.kt
          codec_path = "core/service/listenTogether/src/commonMain/kotlin/org/simpmusic/listentogether/MessageCodec.kt"
          if os.path.exists(codec_path):
              print(f"Vá lỗi Okio trong: {codec_path}")
              with open(codec_path, "r", encoding="utf-8") as f:
                  code = f.read()
              code = code.replace(
                  "GzipSink(sink).buffer().use { it.write(data) }",
                  "val g = GzipSink(sink).buffer()\n        g.write(data)\n        g.close()"
              )
              code = code.replace(
                  "GzipSource(Buffer().apply { write(data) }).buffer().use { it.readByteArray() }",
                  "val g = GzipSource(Buffer().apply { write(data) }).buffer()\n            val r = g.readByteArray()\n            g.close()\n            r"
              )
              with open(codec_path, "w", encoding="utf-8") as f:
                  f.write(code)

          print("--- HOÀN TẤT VÁ LỖI TỔNG THỂ ---")
          '

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Cấp quyền thực thi cho Gradle
        run: chmod +x ./gradlew

      - name: Biên dịch Kotlin Native Framework độc lập
        run: ./gradlew :composeApp:linkDebugFrameworkIosArm64 --stacktrace

      - name: Đóng gói thành file .ipa
        run: |
          mkdir -p build/Payload/SimpMusic.app
          FRAMEWORK_DIR=$(find composeApp/build/bin/iosArm64 -name "ComposeApp.framework" -type d | head -n 1)
          echo "Tìm thấy Framework tại: $FRAMEWORK_DIR"
          
          cp -r "$FRAMEWORK_DIR" build/Payload/SimpMusic.app/
          cp iosApp/Info.plist build/Payload/SimpMusic.app/
          
          cd build
          zip -r SimpMusic.ipa Payload

      - name: Tải file .ipa lên Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SimpMusic-iOS-IPA
          path: build/SimpMusic.ipa
          retention-days: 7
